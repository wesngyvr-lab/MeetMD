<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MeetMD</title>
  <style>
    body { font-family: -apple-system, sans-serif; width: 280px; padding: 16px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    button { width: 100%; padding: 8px; font-size: 13px; cursor: pointer; }
    .status { font-size: 12px; color: #555; margin: 8px 0; }
    .status strong { color: #000; }
    label { font-size: 11px; color: #555; display: block; margin: 12px 0 4px; }
    .row { display: flex; gap: 6px; }
    .row input { flex: 1; min-width: 0; padding: 6px; font-size: 13px; }
    .row button { width: auto; padding: 6px 10px; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>MeetMD</h1>
  <div class="status" id="saveTarget"></div>
  <div class="status" id="pending"></div>
  <button id="flushBtn">Save pending drafts now</button>

  <label for="folderInput">Save folder (inside Downloads)</label>
  <div class="row">
    <input id="folderInput" placeholder="MeetMD" />
    <button id="saveFolderBtn">Save</button>
  </div>
  <div class="hint" id="folderHint">Leave empty to save directly in Downloads.</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
